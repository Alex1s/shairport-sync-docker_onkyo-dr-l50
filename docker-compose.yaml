services:
  api:
    restart: unless-stopped
    build: api
    network_mode: host
    environment:
      API_PORT: 8080
    devices:
      - /dev/lirc0
  shairport-sync:
    restart: unless-stopped
    image: mikebrady/shairport-sync:4.3.7
    network_mode: host
    volumes:
      - ./shairport-sync.conf:/etc/shairport-sync.conf:ro
    devices:
      - /dev/snd
